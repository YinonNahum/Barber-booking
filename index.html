<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ינון נחום · לא עוד סתם תספורת</title>
<meta name="description" content="ספר גברים · דיוק וסטייל. קביעת תור אונליין בכמה לחיצות.">
<meta name="theme-color" content="#EFEFED">
<meta property="og:title" content="ינון נחום · לא עוד סתם תספורת">
<meta property="og:description" content="ספר גברים · דיוק וסטייל. קובעים תור אונליין.">
<meta property="og:image" content="img/barber.webp">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23111'/%3E%3Crect x='8' y='40' width='48' height='16' fill='%23FF4D1F'/%3E%3Ctext x='32' y='38' font-family='Arial Black,Arial' font-weight='900' font-size='28' fill='white' text-anchor='middle'%3EYN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;700&family=Rubik:wght@500;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<header class="site-header">
  <div class="inner">
    <a class="brand" href="#top">לא עוד סתם תספורת.</a>
    <button class="menu-btn" type="button" aria-label="תפריט" aria-expanded="false" aria-controls="nav">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.6" aria-hidden="true"><path d="M4 9h16M4 15h16"/></svg>
    </button>
    <nav class="nav" id="nav" aria-label="ניווט ראשי">
      <a href="#works">העבודות</a>
      <a href="#services">שירותים ומחירים</a>
      <a href="#contact">צור קשר</a>
      <a class="cta" href="#services">קבע תור</a>
    </nav>
  </div>
</header>

<main id="top">

  <div class="wrap">
    <section class="hero" aria-label="פתיחה">
      <h1>YN<span class="sr-only"> · ינון נחום, ספר גברים</span></h1>
      <div class="kicker">
        <span class="bar" aria-hidden="true"></span>
        <span class="k1">ספר גברים</span>
        <span class="k2">דיוק · סטייל</span>
      </div>
      <div class="block-glow" aria-hidden="true"></div>
      <img class="figure" src="img/barber.webp" alt="ינון נחום מחזיק מספריים" width="640" height="1335" fetchpriority="high">
      <div class="block-tint" aria-hidden="true"></div>
      <a class="book-btn" href="#services">קבע תור <span aria-hidden="true">←</span></a>
    </section>

    <section class="gallery" id="works" aria-labelledby="works-h">
      <div class="sec-head">
        <h2 id="works-h">העבודות</h2>
        <span class="step" aria-hidden="true">החלק ←</span>
      </div>
      <div class="track" tabindex="0" aria-label="גלריית עבודות, גלול הצידה">
        <figure><div class="ph"><img src="img/work1.webp" alt="טייפר עם טקסטורה למעלה" loading="lazy" width="600" height="800"></div><figcaption><b>טייפר עם טקסטורה</b></figcaption></figure>
        <figure><div class="ph"><img src="img/work2.webp" alt="מידל פארט עם פלואו אחורי" loading="lazy" width="600" height="800"></div><figcaption><b>מידל פארט עם פלואו אחורי</b></figcaption></figure>
        <figure><div class="ph"><img src="img/work3.webp?v=2" alt="בארסט פייד" loading="lazy" width="600" height="800"></div><figcaption><b>בארסט פייד</b></figcaption></figure>
        <figure><div class="ph"><img src="img/work4.webp" alt="טייפר וזקן" loading="lazy" width="600" height="800"></div><figcaption><b>טייפר וזקן</b></figcaption></figure>
        <figure><div class="ph"><img src="img/work5.webp?v=2" alt="תספורת וזקן מלא מעוצב" loading="lazy" width="600" height="800"></div><figcaption><b>זקן מלא מעוצב</b></figcaption></figure>
      </div>
    </section>
  </div>

  <div class="booking" id="booking">
    <!-- Step 1 -->
    <section class="card" id="services" aria-labelledby="svc-h">
      <div class="sec-head"><h2 id="svc-h">בחר שירות</h2></div>
      <div id="svc-list" role="group" aria-labelledby="svc-h">
        <div class="skeleton" style="height:56px;margin:8px 0"></div>
        <div class="skeleton" style="height:56px;margin:8px 0"></div>
        <div class="skeleton" style="height:56px;margin:8px 0"></div>
      </div>
    </section>

    <!-- Step 2 -->
    <section class="card" id="when" aria-labelledby="when-h" hidden>
      <div class="sec-head"><h2 id="when-h">יום ושעה</h2></div>
      <div class="cal-head">
        <div class="seg" role="group" aria-label="תצוגת יומן">
          <button type="button" data-view="month">חודש</button>
          <button type="button" data-view="week">שבוע</button>
          <button type="button" data-view="day">יום</button>
        </div>
        <div class="cal-nav">
          <button type="button" class="cal-arrow" id="cal-prev" aria-label="הקודם">→</button>
          <span id="cal-label" aria-live="polite"></span>
          <button type="button" class="cal-arrow" id="cal-next" aria-label="הבא">←</button>
        </div>
      </div>
      <div id="cal"></div>
      <div id="slots-area" aria-live="polite"></div>
      <p class="policy" id="policy-short"></p>
    </section>

    <!-- Step 3 -->
    <section class="card" id="details" aria-labelledby="det-h" hidden>
      <div class="sec-head"><h2 id="det-h">הפרטים שלך</h2></div>
      <form id="details-form" novalidate>
        <label class="field">שם מלא
          <input id="f-name" name="name" autocomplete="name" required maxlength="60">
        </label>
        <label class="field">טלפון נייד
          <input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="05X-XXXXXXX" required dir="ltr" style="text-align:right">
        </label>
        <div class="alert warn" id="policy-full"></div>
        <label style="display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:15px;min-height:44px">
          <input type="checkbox" id="f-agree" required style="width:22px;height:22px;margin-top:2px;accent-color:#FF4D1F">
          <span>קראתי ואני מסכים למדיניות הביטול</span>
        </label>
        <div id="form-msg" role="alert"></div>
      </form>
    </section>

    <!-- Done -->
    <section class="card done" id="done" hidden aria-live="polite"></section>
  </div>

  <div class="confirm-bar inactive" id="confirm-bar" hidden>
    <button class="main" id="confirm-main" type="button"><span id="cb-title">בחר שירות</span><small id="cb-sub"></small></button>
    <button class="arrow" id="confirm-arrow" type="button" aria-label="המשך">←</button>
  </div>
</main>

<footer class="site-footer" id="contact">
  <div class="inner">
    <div>
      <div style="font-weight:700" id="ft-name">ינון נחום</div>
      <div id="ft-address"></div>
      <div id="ft-nav"></div>
      <div id="ft-phone"></div>
    </div>
    <div class="hours" id="ft-hours"></div>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/booking.js"></script>
</body>
</html>
